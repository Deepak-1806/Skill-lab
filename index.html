<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f2f4ef">
  <title>Daily Ledger | Expense tracker</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202923;
      --muted: #727b73;
      --line: #e4e8e1;
      --paper: #ffffff;
      --canvas: #f2f4ef;
      --green: #174b3d;
      --green-dark: #10392f;
      --lime: #d9f36a;
      --coral: #f17b62;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--canvas);
      background-image: radial-gradient(#dfe5dc 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      color: var(--ink);
      font-family: "Aptos", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }

    .shell {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 10px;
      background: var(--green);
      color: var(--lime);
      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: 700;
    }

    .today {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .page-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1, h2, p { margin: 0; }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 4vw, 43px);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.08;
    }

    .page-heading p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 14px;
    }

    .month-label {
      padding: 9px 12px;
      border: 1px solid #dfe4dc;
      border-radius: 999px;
      color: #4f5a51;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(270px, 350px) minmax(0, 1fr);
      align-items: start;
      gap: 20px;
    }

    .sidebar, .content { display: grid; gap: 18px; }

    .total-panel {
      min-height: 176px;
      padding: 22px;
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--green);
      color: white;
      position: relative;
    }

    .total-panel::after {
      position: absolute;
      right: -38px;
      bottom: -76px;
      width: 190px;
      height: 190px;
      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 50%;
      box-shadow: 0 0 0 19px rgb(255 255 255 / 5%), 0 0 0 39px rgb(255 255 255 / 4%);
      content: "";
      pointer-events: none;
    }

    .total-label {
      color: #c4d8cf;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .total-amount {
      margin-top: 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 4vw, 42px);
      letter-spacing: 0;
      line-height: 1;
      overflow-wrap: anywhere;
    }

    .total-foot {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 17px;
      color: #d6e3dd;
      font-size: 12px;
    }

    .total-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lime);
    }

    .panel {
      border: 1px solid #e6e9e3;
      border-radius: var(--radius);
      background: var(--paper);
    }

    .form-panel { padding: 21px; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .section-kicker {
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .field { display: grid; gap: 7px; margin-bottom: 15px; }

    label {
      color: #4d584f;
      font-size: 12px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      min-height: 43px;
      padding: 10px 12px;
      border: 1px solid #dce2da;
      border-radius: 7px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input::placeholder { color: #a1a9a0; }

    input:focus, select:focus {
      border-color: #568573;
      box-shadow: 0 0 0 3px rgb(86 133 115 / 15%);
    }

    .amount-wrap { position: relative; }

    .currency-symbol {
      position: absolute;
      top: 50%;
      left: 13px;
      color: #7b857c;
      font-size: 14px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .amount-wrap input { padding-left: 28px; }

    .add-button {
      display: flex;
      width: 100%;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 4px;
      border: 0;
      border-radius: 7px;
      background: var(--green);
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: background 140ms ease, transform 140ms ease;
    }

    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: translateY(1px); }
    .add-button:focus-visible, .delete-button:focus-visible { outline: 3px solid #94bbaa; outline-offset: 2px; }

    .plus { color: var(--lime); font-size: 20px; font-weight: 400; line-height: 1; }

    .list-panel { overflow: hidden; }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 21px 22px 17px;
      border-bottom: 1px solid var(--line);
    }

    .list-heading { display: flex; align-items: baseline; gap: 9px; }

    .count-badge {
      display: grid;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      place-items: center;
      border-radius: 999px;
      background: #eef2ec;
      color: #687369;
      font-size: 11px;
      font-weight: 700;
    }

    .list-caption { color: var(--muted); font-size: 12px; }

    .expense-list { list-style: none; margin: 0; padding: 0; }

    .expense-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto 34px;
      align-items: center;
      gap: 13px;
      min-height: 78px;
      padding: 13px 20px;
      border-bottom: 1px solid #edf0eb;
      animation: arrive 220ms ease both;
    }

    .expense-row:last-child { border-bottom: 0; }

    .category-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 10px;
      background: #edf4e9;
      color: var(--green);
      font-family: Georgia, serif;
      font-size: 17px;
      font-weight: 700;
    }

    .category-mark[data-category="Food"] { background: #fff0e9; color: #ae553e; }
    .category-mark[data-category="Transport"] { background: #e9f1f7; color: #416b88; }
    .category-mark[data-category="Shopping"] { background: #f2edf7; color: #765b8b; }
    .category-mark[data-category="Bills"] { background: #f8f1dd; color: #8a712d; }
    .category-mark[data-category="Health"] { background: #e8f4f0; color: #3e7868; }

    .expense-info { min-width: 0; }

    .expense-name {
      overflow: hidden;
      color: #263129;
      font-size: 14px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .expense-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 5px;
      color: #858d84;
      font-size: 11px;
    }

    .meta-separator { color: #c2c9c0; }

    .expense-amount {
      color: #28372e;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .delete-button {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #939b92;
      cursor: pointer;
      font-size: 17px;
      transition: background 140ms ease, color 140ms ease;
    }

    .delete-button:hover { background: #fff0ed; color: #b94e3a; }

    .empty-state {
      display: grid;
      min-height: 220px;
      place-content: center;
      justify-items: center;
      gap: 8px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    .empty-mark {
      display: grid;
      width: 42px;
      height: 42px;
      margin-bottom: 4px;
      place-items: center;
      border-radius: 50%;
      background: #f1f4ef;
      color: var(--green);
      font-family: Georgia, serif;
      font-size: 23px;
    }

    .empty-state strong { color: #475248; font-size: 14px; }
    .empty-state span { font-size: 12px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .shell { width: min(620px, calc(100% - 32px)); padding-top: 23px; }
      .topbar { margin-bottom: 26px; }
      .layout { grid-template-columns: 1fr; gap: 16px; }
      .sidebar { grid-template-columns: 1fr 1fr; align-items: stretch; gap: 14px; }
      .total-panel { min-height: 100%; padding: 19px; }
      .total-amount { margin-top: 14px; font-size: clamp(29px, 7vw, 38px); }
      .form-panel { padding: 18px; }
    }

    @media (max-width: 520px) {
      .shell { width: calc(100% - 28px); padding-top: 18px; }
      .today { font-size: 11px; }
      .page-heading { align-items: center; }
      .page-heading p { max-width: 225px; font-size: 13px; }
      .month-label { padding: 8px 9px; font-size: 10px; }
      .sidebar { grid-template-columns: 1fr; }
      .total-panel { min-height: 152px; }
      .expense-row { grid-template-columns: 38px minmax(0, 1fr) auto 30px; gap: 9px; padding: 12px; }
      .category-mark { width: 38px; height: 38px; }
      .expense-amount { font-size: 13px; }
      .list-header { padding: 18px 15px 15px; }
      .list-caption { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">d.</span> Daily Ledger</div>
      <div class="today" id="todayLabel"></div>
    </header>

    <section class="page-heading" aria-labelledby="pageTitle">
      <div>
        <h1 id="pageTitle">Expenses</h1>
        <p>A clear view of where your money goes.</p>
      </div>
      <span class="month-label" id="monthLabel"></span>
    </section>

    <div class="layout">
      <aside class="sidebar" aria-label="Expense summary and entry">
        <section class="total-panel" aria-live="polite">
          <div class="total-label">Total expense</div>
          <div class="total-amount" id="totalAmount">₹0.00</div>
          <div class="total-foot"><span class="total-dot" aria-hidden="true"></span><span id="totalCount">0 expenses recorded</span></div>
        </section>

        <form class="panel form-panel" id="expenseForm">
          <div class="section-title">
            <h2>Add an expense</h2>
            <span class="section-kicker">NEW ENTRY</span>
          </div>

          <div class="field">
            <label for="expenseName">Expense name</label>
            <input id="expenseName" name="name" type="text" maxlength="60" placeholder="e.g. Weekly groceries" required autocomplete="off">
          </div>

          <div class="field">
            <label for="expenseCategory">Category</label>
            <select id="expenseCategory" name="category" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Health">Health</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="expenseAmount">Amount</label>
            <div class="amount-wrap">
              <span class="currency-symbol" aria-hidden="true">₹</span>
              <input id="expenseAmount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required inputmode="decimal">
            </div>
          </div>

          <div class="field">
            <label for="expenseDate">Date</label>
            <input id="expenseDate" name="date" type="date" required>
          </div>

          <button class="add-button" type="submit"><span class="plus" aria-hidden="true">+</span> Add expense</button>
        </form>
      </aside>

      <section class="content" aria-labelledby="listTitle">
        <div class="panel list-panel">
          <div class="list-header">
            <div class="list-heading">
              <h2 id="listTitle">Expense list</h2>
              <span class="count-badge" id="listCount">0</span>
            </div>
            <span class="list-caption">Most recent first</span>
          </div>
          <ul class="expense-list" id="expenseList" aria-live="polite"></ul>
          <div class="empty-state" id="emptyState">
            <span class="empty-mark" aria-hidden="true">+</span>
            <strong>No expenses yet</strong>
            <span>Add your first expense to get started.</span>
          </div>
        </div>
      </section>
    </div>
    <p class="sr-only" id="statusMessage" role="status" aria-live="polite"></p>
  </main>

  <script>
    const storageKey = "daily-ledger-expenses";
    const currency = new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 2 });
    const dateFormat = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" });
    const form = document.querySelector("#expenseForm");
    const nameInput = document.querySelector("#expenseName");
    const categoryInput = document.querySelector("#expenseCategory");
    const amountInput = document.querySelector("#expenseAmount");
    const dateInput = document.querySelector("#expenseDate");
    const list = document.querySelector("#expenseList");
    const emptyState = document.querySelector("#emptyState");
    const today = new Date();
    const localToday = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    let expenses = loadExpenses();

    document.querySelector("#todayLabel").textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "short", month: "short", day: "numeric"
    }).format(today);
    document.querySelector("#monthLabel").textContent = new Intl.DateTimeFormat(undefined, {
      month: "long", year: "numeric"
    }).format(today);
    dateInput.value = localToday;

    function loadExpenses() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return Array.isArray(saved) ? saved.filter((item) =>
          item && typeof item.id === "string" && typeof item.name === "string" &&
          typeof item.category === "string" && Number.isFinite(item.amount) &&
          typeof item.date === "string"
        ) : [];
      } catch {
        return [];
      }
    }

    function saveExpenses() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(expenses));
      } catch {
        document.querySelector("#statusMessage").textContent = "Your browser could not save this expense for next time.";
      }
    }

    function renderExpenses() {
      const sortedExpenses = [...expenses].sort((first, second) =>
        second.date.localeCompare(first.date) || second.id.localeCompare(first.id)
      );
      const total = expenses.reduce((sum, expense) => sum + expense.amount, 0);

      document.querySelector("#totalAmount").textContent = currency.format(total);
      document.querySelector("#totalCount").textContent = `${expenses.length} ${expenses.length === 1 ? "expense" : "expenses"} recorded`;
      document.querySelector("#listCount").textContent = expenses.length;
      list.replaceChildren();
      list.hidden = sortedExpenses.length === 0;
      emptyState.hidden = sortedExpenses.length > 0;

      for (const expense of sortedExpenses) {
        const row = document.createElement("li");
        row.className = "expense-row";

        const mark = document.createElement("span");
        mark.className = "category-mark";
        mark.dataset.category = expense.category;
        mark.setAttribute("aria-hidden", "true");
        mark.textContent = expense.category.charAt(0).toUpperCase();

        const info = document.createElement("div");
        info.className = "expense-info";

        const expenseName = document.createElement("div");
        expenseName.className = "expense-name";
        expenseName.textContent = expense.name;

        const meta = document.createElement("div");
        meta.className = "expense-meta";
        const category = document.createElement("span");
        category.textContent = expense.category;
        const separator = document.createElement("span");
        separator.className = "meta-separator";
        separator.setAttribute("aria-hidden", "true");
        separator.textContent = "·";
        const date = document.createElement("span");
        date.textContent = dateFormat.format(new Date(`${expense.date}T00:00:00`));
        meta.append(category, separator, date);
        info.append(expenseName, meta);

        const amount = document.createElement("span");
        amount.className = "expense-amount";
        amount.textContent = currency.format(expense.amount);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", `Delete ${expense.name}`);
        deleteButton.addEventListener("click", () => deleteExpense(expense.id));

        row.append(mark, info, amount, deleteButton);
        list.append(row);
      }
    }

    function deleteExpense(id) {
      const deletedExpense = expenses.find((expense) => expense.id === id);
      expenses = expenses.filter((expense) => expense.id !== id);
      saveExpenses();
      renderExpenses();
      if (deletedExpense) {
        document.querySelector("#statusMessage").textContent = `${deletedExpense.name} deleted.`;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const amount = Number(amountInput.value);
      if (!Number.isFinite(amount) || amount <= 0) {
        amountInput.setCustomValidity("Enter an amount greater than zero.");
        amountInput.reportValidity();
        return;
      }

      expenses.push({
        id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
        name: nameInput.value.trim(),
        category: categoryInput.value,
        amount,
        date: dateInput.value
      });
      saveExpenses();
      renderExpenses();
      document.querySelector("#statusMessage").textContent = `${nameInput.value.trim()} added.`;
      form.reset();
      dateInput.value = localToday;
      nameInput.focus();
    });

    amountInput.addEventListener("input", () => amountInput.setCustomValidity(""));
    renderExpenses();
  </script>
</body>
</html>
